[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "B", "SIM", "UP", "N"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test_ganttuml.py"]

[tool.coverage.run]
source = ["ganttuml"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
